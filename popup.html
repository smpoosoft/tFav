<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>tFav</title>
<style>
  body {
    width: 280px;
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 16px;
    color: #202124;
  }
  h1 {
    font-size: 16px;
    font-weight: 700;
    color: #F5A623;
    margin: 0 0 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  h1 span { font-size: 11px; color: #9aa0a6; font-weight: 400; }
  .btn {
    width: 100%;
    box-sizing: border-box;
    padding: 9px 0;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    margin-bottom: 8px;
    transition: background 0.12s;
  }
  .btn-primary {
    background: #F5A623;
    color: #fff;
  }
  .btn-primary:hover { background: #E8941A; }
  .btn-secondary {
    background: #f1f3f4;
    color: #202124;
  }
  .btn-secondary:hover { background: #e3e6ea; }
.checkbox-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #5f6368;
    margin-bottom: 4px;
  }
  .checkbox-row input { margin: 0; }
  .divider {
    border: none;
    border-top: 1px solid #e8eaed;
    margin: 10px 0;
  }
  .hint {
    font-size: 11px;
    color: #9aa0a6;
    margin-top: 4px;
    line-height: 1.4;
  }
  #status {
    font-size: 12px;
    color: #188038;
    min-height: 16px;
    margin-top: 4px;
  }
  #status.error { color: #d93025; }
  details summary { font-size: 12px; color: #5f6368; cursor: pointer; margin: 6px 0; user-select: none; }
  .field { margin-bottom: 6px; }
  .field label { display: block; font-size: 11px; color: #9aa0a6; margin-bottom: 2px; }
  .field input {
    width: 100%; box-sizing: border-box; padding: 5px 7px; font-size: 12px;
    border: 1px solid #dadce0; border-radius: 5px; font-family: inherit;
  }
</style>
</head>
<body>
  <h1>tFav <span>v0.2</span></h1>

  <button id="btnSweep" class="btn btn-primary">收纳</button>

  <button id="btnView" class="btn btn-secondary">查看收藏 / 收纳</button>

  <div class="checkbox-row">
    <input type="checkbox" id="cbKeepTabs" checked>
    <label for="cbKeepTabs">收纳后关闭标签</label>
  </div>
  <div class="hint">勾选后收纳时会关闭标签页，取消勾选仅保存数据不关标签</div>

  <hr class="divider">

  <details id="settings">
    <summary>设置（Turso 云同步）</summary>
    <div class="field">
      <label>Database URL</label>
      <input type="text" id="tursoUrl" placeholder="libsql://xxx.turso.io">
    </div>
    <div class="field">
      <label>Auth Token</label>
      <input type="password" id="tursoToken" placeholder="">
    </div>
    <div class="field">
      <label>收藏文件夹名</label>
      <input type="text" id="bookmarkFolder" placeholder="tFav">
    </div>
    <button id="btnSaveSettings" class="btn btn-secondary">保存设置</button>
  </details>

  <hr class="divider">

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
