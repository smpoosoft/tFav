<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>tFav</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/popup.css">
</head>
<body>
  <h1>tFav <span>v0.3.1</span></h1>

  <button id="btnSweep" class="btn btn-primary">收纳</button>

  <button id="btnView" class="btn btn-secondary">查看收藏 / 收纳</button>

  <div class="checkbox-row">
    <input type="checkbox" id="cbKeepTabs" checked>
    <label for="cbKeepTabs">收纳后关闭标签</label>
  </div>
  <div class="hint">勾选后收纳时会关闭标签页，取消勾选仅保存数据不关标签</div>

  <hr class="divider">

  <details id="settings">
    <summary>设置（Turso 云同步）</summary>
    <div class="field">
      <label>Database URL</label>
      <input type="text" id="tursoUrl" placeholder="libsql://xxx.turso.io">
    </div>
    <div class="field">
      <label>Auth Token</label>
      <input type="password" id="tursoToken" placeholder="">
    </div>
    <div class="field">
      <label>收藏文件夹名</label>
      <input type="text" id="bookmarkFolder" placeholder="tFav">
    </div>
    <button id="btnSaveSettings" class="btn btn-secondary">保存设置</button>
  </details>

  <hr class="divider">

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
